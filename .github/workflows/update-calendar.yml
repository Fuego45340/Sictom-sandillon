name: Mise a jour calendrier SICTOM Sandillon

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install --upgrade pip PyMuPDF

      - name: Detecter et extraire les calendriers officiel
        run: python scripts/update_calendar.py

      - name: Publier les JSON dans le depot si un calendrier a change
        run: |
          if git diff --quiet -- collectes.json 'collectes-*.json'; then
            echo "Aucun changement de calendrier."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add collectes.json collectes-*.json
            git commit -m "Mise a jour automatique des calendriers SICTOM"
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site statique
        run: |
          mkdir -p site
          cp collectes.json site/collectes.json
          cp collectes-*.json site/
          touch site/.nojekyll

      - name: Charger le site pour publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
